<div class="app">
  <header class="header">
    <div class="logo">KEYMETRICS</div>
    <div class="nav-actions">
      <i class="pi pi-bell nav-icon"></i>
      <i class="pi pi-user nav-icon"></i>
      <i class="pi pi-cog nav-icon"></i>
    </div>
  </header>

  <div class="typing-app">
    <main class="typing-wrapper">

      <!-- MODE DESCRIPTION -->
      <div class="motivation-top">
        {{ modeDescription }}
      </div>

      <div class="typing-top three-zone">

        <!-- LEFT: TIMED LEVELS -->
        <div class="difficulty" *ngIf="gameMode === 'timed'">
          <button [class.active]="timedLevel==='easy'" (click)="setTimedLevel('easy')">Easy</button>
          <button [class.active]="timedLevel==='medium'" (click)="setTimedLevel('medium')">Medium</button>
          <button [class.active]="timedLevel==='hard'" (click)="setTimedLevel('hard')">Hard </button>
        </div>

        <!-- CENTER: MODES -->
        <div class="difficulty center">
          <button [class.active]="gameMode==='timed'" (click)="setGameMode('timed')">Timed</button>
          <button [class.active]="gameMode==='zen'" (click)="setGameMode('zen')">Zen</button>
          <button [class.active]="gameMode==='threeMistakes'" (click)="setGameMode('threeMistakes')">3 Mistakes</button>
          <button [class.active]="gameMode==='suddenDeath'" (click)="setGameMode('suddenDeath')">Sudden Death</button>
          <button [class.active]="gameMode==='accuracy'" (click)="setGameMode('accuracy')">Accuracy</button>
        </div>

        <!-- RIGHT: TIMER -->
        <div class="timer" *ngIf="gameMode === 'timed'">
          {{ timeLeft }}<span>s</span>
        </div>

      </div>

      <div class="typing-card">

        <ng-container *ngIf="!finished; else resultView">
          <div class="sentence" #sentenceBox>
            <span
              *ngFor="let l of letters; let i = index"
              [class.pending]="l.status==='pending'"
              [class.correct]="l.status==='correct'"
              [class.wrong]="l.status==='wrong'"
              [class.active]="i === index">
              {{ l.char === ' ' ? '\u00A0' : l.char }}
            </span>
          </div>

          <p class="hint" *ngIf="!timerStarted && gameMode === 'timed'">
            Start typing to begin ⌨️
          </p>
        </ng-container>

        <ng-template #resultView>
          <div class="dashboard">

            <div class="meter">
              <div class="circle"
                [style.background]="'conic-gradient(#4caf50 ' + accuracy + '%, #ddd 0)'">
                <span>{{ accuracy }}%</span>
              </div>
              <p>Accuracy</p>
            </div>

            <div class="meter">
              <div class="circle"
                [style.background]="'conic-gradient(#2196f3 ' + completion + '%, #ddd 0)'">
                <span>{{ completion }}%</span>
              </div>
              <p>Completion</p>
            </div>

            <div class="meter" *ngIf="gameMode === 'timed'">
              <div class="circle"
                [style.background]="'conic-gradient(#ff9800 ' + ((timeTaken / totalTime) * 100) + '%, #ddd 0)'">
                <span>{{ timeTaken }}s</span>
              </div>
              <p>Time</p>
            </div>

          </div>
        </ng-template>

      </div>

      <button class="restart-btn" (click)="startGame()">⟳ Restart Test</button>

    </main>
  </div>
</div>
