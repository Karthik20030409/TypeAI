<div class="app" *ngIf="currentPage === 'landing'">

  <!-- HEADER -->
  <header class="header">
    <div class="logo" (click)="goHome()">TYPE•AI</div>
    <div class="nav-actions">
      <i class="pi pi-bell nav-icon"></i>
      <i class="pi pi-user nav-icon"></i>
      <i class="pi pi-cog nav-icon"></i>
    </div>
  </header>

  <!-- MAIN -->
  <section class="main">

    <!-- HERO -->
    <div class="hero">
      <div class="hero-inner">
        <h1 class="hero-title">Speed is <span>intelligence</span></h1>
        <p class="hero-subtitle">Measure real typing performance with ease.</p>

        <p class="typing-effect">
          {{ typingText }}<span class="cursor"></span>
        </p>

        <button class="primary btn-animated" (click)="startTyping()">
          Start Typing
        </button>

        <div class="error" *ngIf="errors.start">{{ errors.start }}</div>
      </div>
    </div>

    <!-- AUTH -->
    <aside class="auth-panel">

      <div class="tabs">
        <span [class.active]="authMode==='login'" (click)="authMode='login'">Login</span>
        <span [class.active]="authMode==='signup'" (click)="authMode='signup'">Sign Up</span>
      </div>

      <!-- NAME -->
      <div *ngIf="authMode==='signup'">
        <label>Name</label>
        <input [(ngModel)]="name" />
        <div class="error" *ngIf="errors.name">{{ errors.name }}</div>
      </div>

      <!-- EMAIL -->
      <label>Email</label>
      <input [(ngModel)]="email" />
      <div class="error" *ngIf="errors.email">{{ errors.email }}</div>

      <!-- PASSWORD -->
      <label *ngIf="authMode!=='forgot'">Password</label>
      <input *ngIf="authMode!=='forgot'" type="password" [(ngModel)]="password" />
      <div class="error" *ngIf="errors.password">{{ errors.password }}</div>

      <!-- RESET PASSWORD -->
      <div *ngIf="authMode==='forgot'">
        <label>New Password</label>
        <input type="password" [(ngModel)]="newPassword" />
        <button class="primary btn-animated login" (click)="resetPassword()">
          Reset Password
        </button>
      </div>

      <!-- ACTION -->
      <button *ngIf="authMode!=='forgot'"
        class="primary btn-animated login"
        (click)="authenticate()">
        {{ authMode === 'login' ? 'Log In' : 'Create Account' }}
      </button>

      <div class="links">
        <span (click)="forgotPassword()">Forgot Password?</span>
        <span (click)="continueAsGuest()">Continue as Guest</span>
      </div>

    </aside>

  </section>
</div>
