<div class="app">

  <!-- HEADER -->
  <header class="header">
    <div class="logo" (click)="goHome()">TYPE•AI</div>

    <div class="actions">
      <div class="nav-actions">
        <i class="pi pi-bell nav-icon"></i>
        <i class="pi pi-user nav-icon"></i>
        <i class="pi pi-cog nav-icon"></i>
      </div>
    </div>
  </header>

  <!-- MAIN -->
  <section class="main">

    <!-- HERO -->
    <div class="hero">
      <div class="hero-inner">
        <h1 class="hero-title">
          Speed is <span>intelligence</span>
        </h1>
        <p class="hero-subtitle">
          Measure real typing performance with ease.
        </p>

        <!-- Catchy dynamic text -->
        <p class="hero-highlight">
          ⏰ Boost your <strong>accuracy</strong> & <strong>speed</strong> every day! ✨
        </p>

        <!-- Feature list -->
        <p class="typing-effect">
          {{ typingText }}<span class="cursor"></span>
        </p>
        <button class="primary btn-animated" (click)="startTyping()">Start Typing</button>

        <!-- Optional typing hint animation -->

        <!-- Floating illustration placeholder -->

      </div>
    </div>

    <!-- AUTH PANEL (RIGHT SIDE COMPONENT) -->
    <aside class="auth-panel">
      <div class="tabs">
        <span [class.active]="authMode === 'login'" (click)="authMode = 'login'">
          Login
        </span>
        <span [class.active]="authMode === 'signup'" (click)="authMode = 'signup'">
          Sign Up
        </span>
      </div>

      <label>Email</label>
      <input type="email" placeholder="Email" [(ngModel)]="email" />

      <label>Password</label>
      <input type="password" placeholder="Password" [(ngModel)]="password" />





      <button class="primary btn-animated login" (click)="authenticate()">
        {{ authMode === 'login' ? 'Log In' : 'Create Account' }}
      </button>

      <div class="links">
        <span (click)="forgotPassword()">Forgot Password?</span>
        <span (click)="continueAsGuest()">Continue as Guest</span>
      </div>
    </aside>

  </section>

  <!-- FOOTER -->
 

</div>
