<div class="app">

  <!-- HEADER -->
  <header class="header">
    <div class="logo" (click)="goHome()">TYPE•AI</div>

    <div class="actions">
      <button class="login-btn" (click)="openAuth('login')">
        Login
      </button>
    </div>
  </header>

  <!-- MAIN -->
  <section class="main">

    <!-- HERO -->
    <div class="hero">
      <div class="hero-inner">
        <h1>Speed is intelligence</h1>
        <p>Measure real typing performance.</p>

        <button class="primary" (click)="startTyping()">
          Start Typing
        </button>
      </div>
    </div>

    <!-- AUTH PANEL (RIGHT SIDE COMPONENT) -->
    <aside class="auth-panel" *ngIf="showAuth">
      <div class="tabs">
        <span
          [class.active]="authMode === 'login'"
          (click)="authMode = 'login'"
        >
          Login
        </span>
        <span
          [class.active]="authMode === 'signup'"
          (click)="authMode = 'signup'"
        >
          Sign Up
        </span>
      </div>

      <label>Email</label>
      <input
        type="email"
        placeholder="Email"
        [(ngModel)]="email"
      />

      <label>Password</label>
      <input
        type="password"
        placeholder="Password"
        [(ngModel)]="password"
      />

      
        
      

      <button class="primary full" (click)="authenticate()">
        {{ authMode === 'login' ? 'Log In' : 'Create Account' }}
      </button>

      <div class="links">
        <span (click)="forgotPassword()">Forgot Password?</span>
        <span (click)="continueAsGuest()">Continue as Guest</span>
      </div>
    </aside>

  </section>

  <!-- FOOTER -->
  <footer class="footer">
    <span>Privacy Policy</span>
    <span>Terms of Service</span>
    <span>Support</span>
  </footer>

</div>
