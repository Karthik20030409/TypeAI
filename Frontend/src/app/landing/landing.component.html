<div class="app">
  <!-- HEADER -->
  <header class="header">
    <div class="logo">KEYMETRICS</div>

    <div class="nav-actions">
      <i class="pi pi-bell nav-icon"> </i>

      <i class="pi pi-user nav-icon profile"> </i>
      <i class="pi pi-cog nav-icon" (click)="toggleSettings()"></i>
      <div class="settings-menu" *ngIf="showSettings">
        <span>option 1</span>
        <span>option 2 </span>
      </div>
    </div>
  </header>

  <!-- MAIN -->
  <section class="main">
    <!-- HERO -->
    <div class="hero">
      <div class="hero-inner">
        <h1 class="hero-title">Speed is <span>intelligence</span></h1>
        <p class="hero-subtitle">Measure real typing performance with ease.</p>

        <p class="typing-effect">
          {{ typingText }}<span class="cursor"></span>
        </p>

        <button class="primary btn-animated" (click)="startTyping()">
          Start Typing
        </button>
      </div>
    </div>

    <!-- AUTH -->
    <aside class="auth-panel">
      <div class="tabs">
        <span [class.active]="authMode === 'login'" (click)="authMode = 'login'"
          >Login</span
        >
        <span
          [class.active]="authMode === 'signup'"
          (click)="authMode = 'signup'"
          >Sign Up</span
        >
      </div>

      <div *ngIf="authMode === 'signup'">
        <label>Name</label>
        <input [(ngModel)]="name" />
        <div class="error">{{ errors.name }}</div>
      </div>

      <label>Email</label>
      <input [(ngModel)]="email" />
      <div class="error">{{ errors.email }}</div>

      <label>Password</label>
      <input type="password" [(ngModel)]="password" />
      <div class="error">{{ errors.password }}</div>

      <button class="primary btn-animated login" (click)="authenticate()">
        {{ authMode === "login" ? "Log In" : "Create Account" }}
      </button>

      <div class="links">
        <span (click)="forgotPassword()">Forgot Password?</span>
        <span (click)="continueAsGuest()">Continue as Guest</span>
      </div>
    </aside>
  </section>
</div>
<div
  class="toast-notification"
  *ngIf="toast.show"
  [ngClass]="toast.type"
  (click)="toast.show = false"
>
  <div class="toast-left">
    <span class="toast-icon">
      <ng-container *ngIf="toast.type === 'success'">✔️</ng-container>
      <ng-container *ngIf="toast.type === 'error'">❌</ng-container>
    </span>
    <div class="toast-content">
      <div class="toast-title">{{ toast.type | titlecase }}</div>
      <div class="toast-message">{{ toast.message }}</div>
    </div>
  </div>
  <span class="toast-close" (click)="toast.show = false">&times;</span>
</div>
