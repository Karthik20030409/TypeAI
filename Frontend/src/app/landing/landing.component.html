<div class="app">
  <!-- HEADER (UNCHANGED STRUCTURE) -->
  <header class="header">
    <div class="logo" (click)="goHome()">TYPE•AI</div>

    <div class="actions">
      <ng-container *ngIf="!isAuthenticated; else user">
        <button class="primary" (click)="openAuth('login')">Login</button>
      </ng-container>

      <ng-template #user>
        <div class="avatar">
          <img src="https://i.pravatar.cc/60" (click)="toggleMenu()" />
          <div class="menu" *ngIf="menuOpen">
            <button (click)="logout()">Logout</button>
          </div>
        </div>
      </ng-template>
    </div>
  </header>

  <!-- MAIN -->
  <section class="main">

    <!-- HERO -->
    <div class="hero">
      <div class="hero-inner">
        <h1>Speed is intelligence</h1>
        <p>Measure real typing performance.</p>

        <button class="primary" (click)="startTyping()">
          Start Typing
        </button>

        <div class="warn" *ngIf="showWarn">
          Please login to continue
        </div>
      </div>
    </div>

    <!-- AUTH PANEL (RIGHT SIDE COMPONENT) -->
    <aside class="auth-panel" *ngIf="showAuth">
      <h2>{{ authMode === 'login' ? 'Login' : 'Create account' }}</h2>

      <ng-container *ngIf="authMode === 'signup'">
        <label>Name</label>
        <input placeholder="Your name" [(ngModel)]="name" />
        <div class="input-warn" *ngIf="errors.name">{{ errors.name }}</div>
      </ng-container>

      <label>Email</label>
      <input placeholder="Email" [(ngModel)]="email" />
      <div class="input-warn" *ngIf="errors.email">{{ errors.email }}</div>

      <label>Password</label>
      <input type="password" placeholder="Password" [(ngModel)]="password" />
      <div class="input-warn" *ngIf="errors.password">
        {{ errors.password }}
      </div>

      <button class="primary full" (click)="authenticate()">
        Continue
      </button>

      <div class="switch">
        {{ authMode === 'login' ? 'New here?' : 'Already have account?' }}
        <span (click)="switchMode()">Switch</span>
      </div>
    </aside>

  </section>
</div>
