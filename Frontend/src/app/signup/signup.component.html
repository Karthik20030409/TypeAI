<!-- NAV -->
<nav class="nav">
  <div class="logo">TYPE<span>•</span>AI</div>
  <button class="ghost" (click)="goHome()">Back to Home</button>
</nav>

<!-- SIGNUP SHELL -->
<section class="signup-shell">
  <div class="signup-panel">

    <!-- LEFT -->
    <div class="signup-context">
      <h1>
        Create<br />
        <span>your identity</span>
      </h1>

      <p>
        This is where performance begins.<br />
        Own your speed.
      </p>

      <div class="metrics">
        <div>
          <strong>10M+</strong>
          <span>Tests Taken</span>
        </div>
        <div>
          <strong>99%</strong>
          <span>Focus Mode</span>
        </div>
        <div>
          <strong>0</strong>
          <span>Distractions</span>
        </div>
      </div>
    </div>

    <!-- RIGHT -->
    <div class="signup-form">
      <div class="form-header">
        <h2>Create account</h2>
        <p>One step closer to mastery.</p>
      </div>

      <form>
        <div class="field">
          <label>Name</label>
          <input type="text" placeholder="Your name" />
        </div>

        <div class="field">
          <label>Email</label>
          <input type="email" placeholder="you@domain.com" />
        </div>

        <div class="field">
          <label>Password</label>
          <input type="password" placeholder="••••••••" />
        </div>

        <button class="primary full" type="button">
          Create Account
        </button>

        <div class="divider">or</div>

        <button class="oauth" type="button">
          Sign up with Google
        </button>
      </form>

      <div class="foot">
        Already have an account?
        <a (click)="goToLogin()">Sign in</a>
      </div>
    </div>

  </div>
</section>

<footer>
  Secure signup • No spam • No nonsense
</footer>
